name: Compilar Metrys 0.6.11 - UX e streaming
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/compilar-metrys-0.6.11-recuperacao.yml'
permissions:
  contents: read
jobs:
  compilar:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - name: Preparar SDK
        run: sdkmanager --install 'platforms;android-36' 'build-tools;36.0.0'
      - name: Baixar código 0.6.11 sem chaves privadas
        env:
          ZIP_URL: 'https://56d884c7-9ff8-4227-a875-7f625826c1a4.sandbox.floot.app/_cdn/static/3adbf347-1895-49f9-993b-94f60cfc90e8-Metrys-0.6.8-Interface-Real-Fontes.zip'
          ZIP_SHA256: 'b2aedf8fe041a46a6b267f8a9fd66a6d716b68ea2cf5e0ef8a295d9d83e11d96'
        shell: bash
        run: |
          set -euo pipefail
          curl -fLsS --retry 3 --max-time 240 --output codigo.zip "$ZIP_URL"
          echo "$ZIP_SHA256  codigo.zip" | sha256sum --check
          python3 - <<'PY'
          import zipfile
          from pathlib import Path
          with zipfile.ZipFile('codigo.zip') as z:
              for i in z.infolist():
                  p=Path(i.filename)
                  if not p.parts or p.parts[0]!='metrys-mobile' or '..' in p.parts or p.is_absolute() or i.file_size>20000000 or (i.external_attr>>16)&0o170000==0o120000:
                      raise SystemExit('Entrada inválida: '+i.filename)
                  z.extract(i,'codigo')
          fonte=Path('codigo/metrys-mobile')
          for f in ('scripts/compilar-apk.py','android/AndroidManifest.xml','android/jniLibs/arm64-v8a/libmetrys.so'):
              if not (fonte/f).is_file():raise SystemExit('Fonte ausente: '+f)
          PY
      - name: Aplicar correções de interface e serviço 0.6.11
        env:
          PATCH_URL: 'https://56d884c7-9ff8-4227-a875-7f625826c1a4.sandbox.floot.app/_cdn/static/6359b8b5-e3a4-4d08-9912-bac0cffc1564-Metrys-0.6.9-UX-Patch-Corrigido.zip'
          PATCH_SHA: '399e2d4aff7838949a6da8d732514b5fa672692197aa084f722cec89ac3c3390'
        run: |
          curl -fLsS --retry 3 --max-time 90 --output atualizacao.zip "$PATCH_URL"
          echo "$PATCH_SHA  atualizacao.zip" | sha256sum --check
          python3 - <<'PY'
          import zipfile
          from pathlib import Path
          prefix='metrys-mobile/android/'
          with zipfile.ZipFile('atualizacao.zip') as z:
              for i in z.infolist():
                  p=Path(i.filename)
                  if not i.filename.startswith(prefix) or p.is_absolute() or '..' in p.parts or i.file_size>250_000 or ((i.external_attr>>16)&0o170000)==0o120000:
                      raise SystemExit('Patch inválido: '+i.filename)
                  z.extract(i, 'codigo')
          PY
      - name: Reverter motor e interface para base funcional 0.6.9 e incrementar versao
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re,hashlib
          raiz=Path('codigo/metrys-mobile/android')
          manifest=raiz/'AndroidManifest.xml'
          s=manifest.read_text()
          assert 'package="br.com.anderflow.metrys.offline"' in s
          assert 'android:versionCode="18"' in s and 'android:versionName="0.6.9"' in s
          s=s.replace('android:versionCode="18"','android:versionCode="20"')
          s=s.replace('android:versionName="0.6.9"','android:versionName="0.6.11"')
          manifest.write_text(s)
          tela=raiz/'src/br/com/anderflow/metrys/offline/TelaOffline.java'
          t=tela.read_text()
          assert 'v0.6.9' in t
          tela.write_text(t.replace('v0.6.9','v0.6.11'))
          so=raiz/'jniLibs/arm64-v8a/libmetrys.so'
          esperado='0bbc4b1f616cad4b83fc332041db7fe2fe27af4624282a7d8ba9efd1b2bc373a'
          real=hashlib.sha256(so.read_bytes()).hexdigest()
          assert real==esperado, 'Motor nativo difere da versao funcional 0.6.9'
          print('Recuperacao com motor original verificado; versionCode=20')
          PY
      - name: Executar testes locais
        run: python3 codigo/metrys-mobile/scripts/testar-evolucao.py
      - name: Gerar pacote alinhado sem acesso à chave original
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('codigo/metrys-mobile/scripts/compilar-apk.py')
          s=p.read_text()
          marca=" priv=RAIZ/'android/.assinatura';"
          if marca not in s:raise SystemExit('Trecho de assinatura não localizado')
          s=s.split(marca,1)[0]
          s+='\n'.join([
            " rodar(bt/'zipalign','-f','-P','16','4',w/'base.apk',w/'alinhado.apk')",
            " a.saida.parent.mkdir(parents=True,exist_ok=True)",
            " shutil.copy2(w/'alinhado.apk',a.saida)",
            " print('APK alinhado sem assinatura para operação privada.')",
            " return",
            "if __name__=='__main__':main()"
          ])+'\n'
          p.write_text(s)
          PY
          FERRAMENTAS="$RUNNER_TEMP/ferramentas"
          mkdir -p "$FERRAMENTAS/jdk-17.0.20.1+1/bin"
          ln -s "$ANDROID_HOME" "$FERRAMENTAS/sdk"
          for comando in java javac keytool; do ln -s "$(command -v "$comando")" "$FERRAMENTAS/jdk-17.0.20.1+1/bin/$comando"; done
          python3 codigo/metrys-mobile/scripts/compilar-apk.py --ferramentas "$FERRAMENTAS" --variante original --saida "$GITHUB_WORKSPACE/Metrys-0.6.11-SEM-ASSINATURA.apk"
          "$ANDROID_HOME/build-tools/36.0.0/aapt2" dump badging Metrys-0.6.11-SEM-ASSINATURA.apk | grep '^package:'
          cp "$ANDROID_HOME/build-tools/36.0.0/lib/apksigner.jar" ./apksigner-36.0.0.jar
          cp "$ANDROID_HOME/build-tools/36.0.0/zipalign" ./zipalign-36.0.0
          chmod +x ./zipalign-36.0.0
          sha256sum Metrys-0.6.11-SEM-ASSINATURA.apk > pacote.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: Metrys-0.6.11-UX-Sem-Assinatura
          path: |
            Metrys-0.6.11-SEM-ASSINATURA.apk
            apksigner-36.0.0.jar
            zipalign-36.0.0
            pacote.sha256
          retention-days: 7
          if-no-files-found: error
