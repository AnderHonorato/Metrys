name: Metrys 0.6.17 · redesenho das telas e preservacao do banco
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/compilar-metrys-0.6.17-claudinho.yml'
permissions:
  contents: read
jobs:
  compilar:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - name: Preparar SDK
        run: sdkmanager --install 'platforms;android-36' 'build-tools;36.0.0'
      - name: Baixar código 0.6.17 sem chaves privadas
        env:
          ZIP_URL: 'https://56d884c7-9ff8-4227-a875-7f625826c1a4.sandbox.floot.app/_cdn/static/af8a0755-21f0-476a-9132-1ff2a2d37616-Metrys-0.6.17-Codigo-Fonte-Visual-Claudinho.zip'
          ZIP_SHA256: '0d20280a1b26a72aa645f89e527455cd953c5832492ff99b5e908c865b367539'
        shell: bash
        run: |
          set -euo pipefail
          curl -fLsS --retry 3 --max-time 240 --output codigo.zip "$ZIP_URL"
          echo "$ZIP_SHA256  codigo.zip" | sha256sum --check
          python3 - <<'PY'
          import zipfile
          from pathlib import Path
          with zipfile.ZipFile('codigo.zip') as z:
              for i in z.infolist():
                  p=Path(i.filename)
                  if not p.parts or p.parts[0]!='metrys-mobile' or '..' in p.parts or p.is_absolute() or i.file_size>20000000 or (i.external_attr>>16)&0o170000==0o120000:
                      raise SystemExit('Entrada inválida: '+i.filename)
                  z.extract(i,'codigo')
          fonte=Path('codigo/metrys-mobile')
          for f in ('scripts/compilar-apk.py','android/AndroidManifest.xml','android/jniLibs/arm64-v8a/libmetrys.so'):
              if not (fonte/f).is_file():raise SystemExit('Fonte ausente: '+f)
          PY
      - name: Incluir correção de contraste revisada no navegador
        run: |
          set -euo pipefail
          cp metrys-mobile/android/assets/viva/estilo.css codigo/metrys-mobile/android/assets/viva/estilo.css
          grep -Fq 'body.claro{color:var(--texto)' codigo/metrys-mobile/android/assets/viva/estilo.css
      - name: Testar front-end WebView e preservar dados Android
        run: |
          set -euo pipefail
          python3 codigo/metrys-mobile/scripts/testar-evolucao.py
          node --check codigo/metrys-mobile/android/assets/viva/aplicativo.js
          python3 - <<'PY'
          from pathlib import Path
          raiz=Path('codigo/metrys-mobile/android')
          m=(raiz/'AndroidManifest.xml').read_text()
          b=(raiz/'src/br/com/anderflow/metrys/offline/BancoMetrys.java').read_text()
          t=(raiz/'src/br/com/anderflow/metrys/offline/TelaViva.java').read_text()
          assert 'versionCode="27"' in m and 'versionName="0.6.17"' in m
          assert 'br.com.anderflow.metrys.offline' in m
          assert 'private static final int VERSAO=4;' in b
          assert 'onUpgrade' in b and 'feedback_respostas' in b
          assert 'file:///android_asset/viva/index.html' in t
          assets=raiz/'assets/viva'
          assert all((assets/i).is_file() for i in ('index.html','estilo.css','aplicativo.js','cenarios/engine.js','cenarios/themes.js','cenarios/themes2.js','cenarios/themes3.js'))
          assert (raiz/'assets/licencas/claudinho-MIT.txt').is_file()
          print('Metrys Viva, 15 cenarios e SQLite v4: checados')
          PY
      - name: Gerar pacote alinhado sem acesso à chave original
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('codigo/metrys-mobile/scripts/compilar-apk.py')
          s=p.read_text()
          marca=" priv=RAIZ/'android/.assinatura';"
          if marca not in s:raise SystemExit('Trecho de assinatura não localizado')
          s=s.split(marca,1)[0]
          s+='\n'.join([
            " rodar(bt/'zipalign','-f','-P','16','4',w/'base.apk',w/'alinhado.apk')",
            " a.saida.parent.mkdir(parents=True,exist_ok=True)",
            " shutil.copy2(w/'alinhado.apk',a.saida)",
            " print('APK alinhado sem assinatura para operação privada.')",
            " return",
            "if __name__=='__main__':main()"
          ])+'\n'
          p.write_text(s)
          PY
          FERRAMENTAS="$RUNNER_TEMP/ferramentas"
          mkdir -p "$FERRAMENTAS/jdk-17.0.20.1+1/bin"
          ln -s "$ANDROID_HOME" "$FERRAMENTAS/sdk"
          for comando in java javac keytool; do ln -s "$(command -v "$comando")" "$FERRAMENTAS/jdk-17.0.20.1+1/bin/$comando"; done
          python3 codigo/metrys-mobile/scripts/compilar-apk.py --ferramentas "$FERRAMENTAS" --variante original --saida "$GITHUB_WORKSPACE/Metrys-0.6.17-SEM-ASSINATURA.apk"
          "$ANDROID_HOME/build-tools/36.0.0/aapt2" dump badging Metrys-0.6.17-SEM-ASSINATURA.apk | grep '^package:'
          cp "$ANDROID_HOME/build-tools/36.0.0/lib/apksigner.jar" ./apksigner-36.0.0.jar
          cp "$ANDROID_HOME/build-tools/36.0.0/zipalign" ./zipalign-36.0.0
          chmod +x ./zipalign-36.0.0
          sha256sum Metrys-0.6.17-SEM-ASSINATURA.apk > pacote.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: Metrys-0.6.17-UX-Sem-Assinatura
          path: |
            Metrys-0.6.17-SEM-ASSINATURA.apk
            apksigner-36.0.0.jar
            zipalign-36.0.0
            pacote.sha256
          retention-days: 7
          if-no-files-found: error
